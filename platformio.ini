; Bambu P1S status display / controller
; Boards: ESP32 "Cheap Yellow Display" family with XPT2046 resistive touch.
;   cyd40: Sunton ESP32-3248S035 style 4.0 inch, 480x320 ST7796
;   cyd32: Sunton ESP32-2432S032R 3.2 inch, 240x320 ST7789
;   cyd28: Sunton ESP32-2432S028R 2.8 inch, 240x320 ILI9341
; All put the display on HSPI (12/13/14/15, DC 2, BL 27). The 4.0 inch shares
; that bus with the touch chip (CS 33); the 2.8 and 3.2 inch put the XPT2046 on
; its own VSPI bus (CLK 25, MOSI 32, MISO 39, CS 33, IRQ 36).

[base]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

; Shared build flags; panel driver, size, and SPI clock are per-environment.
build_flags =
    ; ---- LVGL: pick up include/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; ---- TFT_eSPI panel config (in lieu of User_Setup.h) ----
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D USER_SETUP_LOADED=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    ; Display pins 12/13/14 are the native HSPI pins.
    -D USE_HSPI_PORT=1
    -D SPI_READ_FREQUENCY=20000000
    ; Landscape. Use 3 instead if the image is upside down on your board.
    -D DISPLAY_ROTATION=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1

; ---------------------------------------------------------------------------
; 4.0 inch CYD: 480x320 ST7796 panel, touch on the display bus
[env:cyd40]
extends = base
build_flags =
    ${base.build_flags}
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=55000000
    ; XPT2046 shares the display SPI bus; TFT_eSPI arbitrates via TOUCH_CS.
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

; Touch flags shared by the boards that put the XPT2046 on VSPI.
[touch_vspi]
build_flags =
    -D TOUCH_VSPI_CLK=25
    -D TOUCH_VSPI_MOSI=32
    -D TOUCH_VSPI_MISO=39
    -D TOUCH_VSPI_CS=33
    -D TOUCH_VSPI_IRQ=36

; 3.2 inch CYD (ESP32-2432S032R): 240x320 ST7789 IPS panel.
; TFT_eSPI's ST7789 init already enables inversion and uses RGB order.
; If colors look like a photo negative add -D TFT_INVERSION_OFF=1; if red and
; blue are swapped add -D TFT_RGB_ORDER=TFT_BGR. If the panel stays blank,
; try -D ILI9341_DRIVER=1 in place of ST7789_DRIVER (some batches differ).
[env:cyd32]
extends = base
build_flags =
    ${base.build_flags}
    ${touch_vspi.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=40000000

; 2.8 inch CYD (ESP32-2432S028R): 240x320 ILI9341, same wiring as the 3.2 inch.
[env:cyd28]
extends = base
build_flags =
    ${base.build_flags}
    ${touch_vspi.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=55000000

; ---------------------------------------------------------------------------
; Hardware diagnostic builds (color check + touch calibration):
;   pio run -e diag40 -t upload
;   pio run -e diag32 -t upload
[env:diag40]
extends = env:cyd40
build_src_filter = -<*> +<../diag/> +<touch.cpp>

[env:diag32]
extends = env:cyd32
build_src_filter = -<*> +<../diag/> +<touch.cpp>

[env:diag28]
extends = env:cyd28
build_src_filter = -<*> +<../diag/> +<touch.cpp>

; Touch pin scanner for an unknown board: pio run -e touchscan -t upload
[env:touchscan]
extends = env:cyd32
build_src_filter = -<*> +<../probe/>
