; Bambu P1S status display / controller
; Board: ESP32 "Cheap Yellow Display" family (480x320, XPT2046 resistive touch)

[common]
; Shared build flags; the TFT panel driver is chosen per-environment below.
build_flags =
    ; ---- LVGL: pick up include/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; ---- TFT_eSPI panel config (in lieu of User_Setup.h) ----
    ; Touch is NOT handled by TFT_eSPI (the XPT2046 is on its own SPI bus),
    ; so its "TOUCH_CS not defined" warning is expected; this silences it.
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    -D USER_SETUP_LOADED=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=HIGH
    ; Display pins 12/13/14 are the native HSPI pins.
    -D USE_HSPI_PORT=1
    ; XPT2046 touch shares the display SPI bus; TFT_eSPI arbitrates via TOUCH_CS.
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

; Sunton 4.0 inch CYD: 480x320 ST7796 panel, backlight on GPIO 27
build_flags =
    ${common.build_flags}
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=27

; Hardware diagnostic build: pio run -e diag -t upload
[env:diag]
extends = env:cyd
build_src_filter = -<*> +<../diag/>
