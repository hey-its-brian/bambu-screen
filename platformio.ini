; Bambu P1S status display / controller
; Board: ESP32-2432S028R "Cheap Yellow Display" (2.8" 320x240 ILI9341, XPT2046 resistive touch)

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5

build_flags =
    ; ---- LVGL: pick up include/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

    ; ---- TFT_eSPI panel config (in lieu of User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    ; USB-C-only CYD boards usually ship the "2" panel variant with inverted colors.
    ; If your colors look wrong/washed out, swap ILI9341_2_DRIVER for ILI9341_DRIVER
    ; and/or remove TFT_INVERSION_ON.
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_ON=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1
